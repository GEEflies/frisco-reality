name: SEO check

# Runs scripts/seo-check.mjs against the live site so structural SEO
# regressions (canonicals, hreflang, sitemap, h1s, broken links, metadata)
# fail loudly instead of silently costing rankings.
on:
  # Vercel reports each deployment back to GitHub; check production after it goes live.
  deployment_status:
  # Weekly safety net (listings change without deploys). Mondays 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL to check'
        default: 'https://www.frisco.sk'

jobs:
  seo-check:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run SEO check
        run: node scripts/seo-check.mjs "${{ github.event.inputs.url || 'https://www.frisco.sk' }}"
